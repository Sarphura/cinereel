name: spec/ticket sync

on:
  pull_request:
    paths:
      - 'docs/spec/**'
      - '.scratch/**'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  spec-ticket-sync:
    name: docs/spec ↔ .scratch/ drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect spec-only change without scratch update
        run: |
          set -euo pipefail

          # Determine the comparison base.
          # - push to main: compare against the previous commit.
          # - pull_request: compare the PR head against the merge base with the base branch.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          # First commit on the repo: nothing to compare against.
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            echo "No base SHA available; skipping drift check."
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"

          SPEC_CHANGED="$(printf '%s\n' "${CHANGED_FILES}" | grep -E '^docs/spec/' || true)"
          SCRATCH_CHANGED="$(printf '%s\n' "${CHANGED_FILES}" | grep -E '^\.scratch/' || true)"

          echo "Changed files in docs/spec/:"
          printf '%s\n' "${SPEC_CHANGED:-<none>}"
          echo
          echo "Changed files in .scratch/:"
          printf '%s\n' "${SCRATCH_CHANGED:-<none>}"

          if [[ -n "${SPEC_CHANGED}" && -z "${SCRATCH_CHANGED}" ]]; then
            echo "::error::docs/spec/ changed but .scratch/ did not. Spec revisions must update the corresponding tickets in .scratch/" >&2
            exit 1
          fi

          echo "OK — spec/ticket drift check passed."
